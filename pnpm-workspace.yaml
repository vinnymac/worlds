packages:
  - packages/*

catalog:
  '@biomejs/biome': ^2.3.7
  '@testcontainers/mysql': ^11.8.1
  '@testcontainers/postgresql': ^11.8.1
  '@testcontainers/redis': ^11.8.1
  '@types/node': ^22.19.0
  '@vercel/queue': 0.0.0-alpha.36
  '@workflow/errors': 4.1.0-beta.20
  '@workflow/world': 4.1.0-beta.17
  '@workflow/world-local': 4.1.0-beta.51
  '@workflow/world-testing': 4.1.0-beta.53
  cbor-x: ^1.6.0
  dotenv: ^17.2.3
  drizzle-kit: ^0.31.7
  drizzle-orm: ^0.45.2
  ioredis: ^5.10.1
  mysql2: ^3.14.1
  postgres: ^3.4.9
  testcontainers: 11.14.0
  typescript: ^5.9.3
  ulid: ^3.0.2
  vitest: ^3.2.4
  zod: 4.3.6

# pnpm v11: Allow build scripts for native dependencies
# Replaces deprecated onlyBuiltDependencies
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  'cbor-extract': true
  'cpu-features': true
  'esbuild': true
  'msgpackr-extract': true
  'protobufjs': true
  'sharp': true
  'ssh2': true
  'workerd': true

pnpm:
  overrides:
    zod: 4.3.6

savePrefix: ''
