packages:
  - packages/*

catalog:
  '@biomejs/biome': ^2.3.7
  '@testcontainers/mysql': ^11.8.1
  '@testcontainers/postgresql': ^11.8.1
  '@testcontainers/redis': ^11.8.1
  '@types/node': ^22.19.0
  '@workflow/core': 5.0.0-beta.40
  '@workflow/errors': 5.0.0-beta.16
  '@workflow/world': 5.0.0-beta.25
  '@workflow/world-testing': 5.0.0-beta.40
  cbor-x: ^1.6.0
  dotenv: ^17.2.3
  drizzle-kit: ^0.31.7
  drizzle-orm: ^0.45.2
  ioredis: ^5.10.1
  mysql2: ^3.14.1
  postgres: ^3.4.9
  testcontainers: 11.14.0
  tsdown: ^0.22.0
  typescript: ^5.9.3
  ulid: ^3.0.2
  vitest: ^4.1.10

# pnpm v11: Allow build scripts for required native dependencies
# See: https://pnpm.io/11.x/migration#build-scripts-blocking
# All packages listed here are transitively required by test/runtime dependencies
allowBuilds:
  # Binary serialization (CBOR) - used by world-azure, world-mysql*, world-postgres-redis
  'cbor-extract': true
  'msgpackr-extract': true

  # Build/test tooling
  'esbuild': true # JavaScript bundler used by vitest and other dev tools
  '@swc/core': true # TypeScript compiler used by test frameworks

  # Testing infrastructure dependencies
  'ssh2': true # Testcontainers Docker communication
  '@nestjs/core': true # Used by testcontainers
  'protobufjs': true # Protocol buffers (gRPC/Azure/GCP SDKs)
  'sharp': true # Image processing (transitive from GCP/Azure SDKs)
  'cpu-features': true # CPU detection (required by sharp)

  # Cloudflare Workers runtime - world-cloudflare tests
  'workerd': true

pnpm:
  overrides:
    zod: 4.3.6

savePrefix: ''

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.18.4'
  - miniflare@4.20260708.1
  - wrangler@4.110.0
