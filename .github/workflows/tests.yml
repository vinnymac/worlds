name: Tests

on:
  push:
    branches:
      - main
    tags:
      - '!*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each leg pre-pulls only the images it actually starts. Pulling the
        # whole set everywhere meant 9 of 10 legs downloading the ~1GB
        # google-cloud-cli emulator that only world-firestore-tasks uses.
        include:
          - package: '@fantasticfour/shared'
            images: ''
          - package: '@fantasticfour/world-cloudflare'
            images: ''
          - package: '@fantasticfour/world-firestore-tasks'
            images: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:441.0.0-emulators'
          - package: '@fantasticfour/world-mysql'
            images: 'mysql:8.0'
          - package: '@fantasticfour/world-mysql-redis'
            images: 'mysql:8.0 redis:7-alpine'
          - package: '@fantasticfour/world-nats-jetstream'
            images: 'nats:2.10-alpine'
          - package: '@fantasticfour/world-postgres-redis'
            images: 'postgres:15-alpine redis:7-alpine'
          - package: '@fantasticfour/world-redis'
            images: 'redis:7-alpine'
          - package: '@fantasticfour/world-redis-bullmq'
            images: 'redis:7-alpine'
          - package: '@fantasticfour/world-upstash'
            images: 'ghcr.io/vinnymac/serverless-redis-http:latest redis:7-alpine'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      # Runs in the background so image download overlaps pnpm install + build
      # instead of following them. Pulls are network-bound, install/build are
      # CPU-bound, so the two barely contend.
      - name: Pre-pull Testcontainers images
        id: prepull
        if: matrix.images != ''
        background: true
        # `|| true` per image: the pre-pull is a latency optimization, not a
        # gate. Testcontainers pulls on demand anyway, so a registry hiccup
        # should slow the run down, not fail it.
        run: |
          printf '%s\n' testcontainers/ryuk:0.8.1 ${{ matrix.images }} \
            | xargs -n1 -P4 -I{} sh -c 'docker pull {} || true'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Wait for image pulls
        if: matrix.images != ''
        wait: prepull

      - name: Run Unit Tests for ${{ matrix.package }}
        run: pnpm --filter "${{ matrix.package }}" test

  workers:
    name: Cloudflare Workers Runtime
    # Needs no containers: @cloudflare/vitest-pool-workers runs the suite
    # against real workerd, which is the only place Durable Object transaction
    # semantics and DO SQLite storage get exercised for real.
    runs-on: ubuntu-24.04-arm
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run Workers Runtime Tests
        run: pnpm --filter "@fantasticfour/world-cloudflare" test:workers

  azure-tests:
    name: Azure Cosmos DB Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Account for 5-minute emulator startup
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Pre-pull Cosmos DB Emulator
        id: prepull
        background: true
        run: docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Wait for emulator pull
        wait: prepull

      - name: Run Azure Tests
        run: pnpm --filter "@fantasticfour/world-azure" test
